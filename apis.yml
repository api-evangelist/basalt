name: Basalt
description: 'Basalt (Basalt Technologies Corp.) is a San Francisco spacecraft-software company building
  Dispatch, a simulation-based operating system for satellites that makes flight software portable across
  dissimilar spacecraft hardware — pitched as "Windows for spacecraft" and "Constellations as a Service."
  Dispatch provides a common control layer so fleets of different satellites can work together on tasking
  (visible, infrared, and radar imaging), in-orbit networking and telecom, signals intelligence, and
  monitoring or inspecting other on-orbit assets, including autonomous re-tasking for national security
  missions. Founded in 2023 by Max Bhatti and Alex Choi (ex-SpaceX engineers, MIT CubeSat program), Basalt
  is a Y Combinator W24 company that raised a $3.5M seed round led by Initialized Capital in May 2024, with
  participation from Y Combinator, Liquid 2 Ventures, and General Catalyst. The company publishes no public
  developer API, documentation, or SDK surface; this profile captures its identity and probed domain
  security. Sector: frontier-tech / space / defense.'
